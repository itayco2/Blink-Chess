# M12: d512, L12, H16 on Recipe D. 26,746,752 parameters = 26,075,008 non-GAB + 671,744 GAB-lite.
# Steps are 6 GPU-h at the 1,121 samples/s measured at micro-batch 256 (P4, eager):
# 6 * 3600 * 1121 / 1024 = 23,646.
base = "recipe.toml"

[model]
d_model = 512
n_layers = 12
n_heads = 16

[train]
peak_lr = 7e-4
micro_batch = 256      # pinned (schedule review, 2026-09-25): the trainer's eager VRAM probe picks 256
                       # anyway, and 512 compiled was projected to peak ~7.0 GB in the real trainer
                       # against a 6.15 GB budget (a spill runs at 4-8% speed). The size sweep, N* and
                       # the supervisor plan and police this size at bench.json's micro-256 row.
steps = 23646
