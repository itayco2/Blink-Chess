# M: d512, L10, H16 on Recipe D. 22,550,272 parameters = 21,878,528 non-GAB + 671,744 GAB-lite.
# Steps are 6 GPU-h at the 1,567 samples/s measured at micro-batch 256 (P4, eager; below the 1,658
# samples/s epoch floor unless compile makes up the gap): 6 * 3600 * 1567 / 1024 = 33,054.
base = "recipe.toml"

[model]
d_model = 512
n_layers = 10
n_heads = 16

[train]
peak_lr = 7e-4
micro_batch = 256      # pinned (schedule review, 2026-09-25): the trainer's eager VRAM probe picks 256
                       # anyway, and 512 compiled was projected to peak ~7.0 GB in the real trainer
                       # against a 6.15 GB budget (a spill runs at 4-8% speed). The size sweep, N* and
                       # the supervisor plan and police this size at bench.json's micro-256 row.
steps = 33054
