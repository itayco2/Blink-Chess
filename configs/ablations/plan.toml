# P5 recipe ablations on S (d256, L8, H8). Each arm file overrides the recipe; nothing else.
# Arms run in this order through `blink supervise`, each for `hours` of wall-clock after compile,
# including its own 20% WSD cooldown, and are judged only after it. a09 (tau 0.02), a13 (lambda_v 2)
# and a14 (sigma 1.5 bins) are cut from scope: FINDINGS lists them as "not tested".
# blink sweep ablations --plan configs/ablations/plan.toml   (resumable; BLINK_HOME/eval/ablations.json)

[plan]
recipe = "configs/s.toml"    # Recipe D at size S (area P4 writes it)
data = "v1"                   # BLINK_HOME/data/v1 (a relative path is under BLINK_HOME/data)
hours = 1.5
size = "s"                    # the bench.json throughput row that turns hours into steps
sigma_arms = ["a01", "a02", "a03"]
arms = ["a01", "a02", "a03", "a04", "a05", "a11", "a12"]
# Held until their code exists (PF66): a06 static bias, a07 games10k_top1, a08 value mapping and
# mate_preserving, a10 Muon; then a15 (combined winners) last. a06 may leave once the cuda tests in
# tests/test_static_bias.py pass (inductor, bf16, micro-batched: the way P5 trains). a08's mapping
# exists, but its guard mate_preserving must first be written to evals.jsonl for every arm AND for
# the a01-a03 floor (rescore their final checkpoints or re-run them); until then a08 ends
# "not judged". Arms never recorded in ablations.json are pending, so adding them back here
# resumes the same sweep. An arm with [arm] bench_size (a10: s-muon) runs at that bench row's rate;
# bench it first or the sweep refuses.
held = ["a06", "a07", "a08", "a10", "a15"]
slip_cut = ["a10", "a11", "a12"]    # dropped by the P5 slip rule (blink sweep ablations --slip)
disable = []                  # supervise stop rules turned off for every arm (recorded)
